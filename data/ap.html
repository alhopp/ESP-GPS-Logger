<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
<title>Wi-Fi Setup</title>

<link rel="stylesheet" href="/app.css">

<style>
/* AP-only overrides */
nav,#splash{display:none}
header{position:static}
section{margin-top:0;height:auto;overflow:hidden}
.logo{display:block;margin:0 auto 18px;width:240px;max-width:85%}
footer{position:sticky}
html,body{touch-action:manipulation}
#status{margin-top:12px;font-size:14px;color:var(--f);text-align:center}
</style>
</head>

<body>

<header>Wi-Fi Setup</header>

<header>Setup</header>

<section class="a">
  <div class="card">
    <img src="/ESP32_logo.jpg" class="logo" alt="GPS">

    <label for="ssid">Phone hotspot SSID</label>
    <input id="ssid"
           placeholder="e.g. iPhone Hotspot"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false">

    <label for="pass">Password</label>

    <!-- Dummy field to kill password manager heuristics -->
    <input type="password" style="display:none">

    <!-- Real password field -->
    <input id="pass"
           type="password"
           placeholder="Hotspot password"
           autocomplete="new-password"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false">

    <div class="hint">
      Turn on your phone hotspot before saving.
    </div>

    <div id="status"></div>
  </div>
</section>


<footer>
  <button id="saveBtn" onclick="save()">Save &amp; Reboot</button>
</footer>

<script>
const ssidEl = document.getElementById("ssid");
const passEl = document.getElementById("pass");
const statusEl = document.getElementById("status");
const btn = document.getElementById("saveBtn");

async function save(){
  const ssid = ssidEl.value.trim();
  const pass = passEl.value;
  if(!ssid) return alert("SSID required");

  btn.disabled = true;
  statusEl.textContent = "Saving Wi-Fi settings… rebooting device";

  await fetch("/api/config",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ wifi:{ phone_ssid:ssid, phone_pass:pass } })
  });

  await fetch("/api/reboot",{method:"POST"});
}
</script>

</body>
</html>
